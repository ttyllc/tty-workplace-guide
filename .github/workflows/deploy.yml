name: Deploy to Portal VM
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    # User indicated runner is likely on fl-wd-v13 or fl-wd-h9
    runs-on: [self-hosted] 
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy to Portal VM
        run: |
          # Using rsync to push files to the portal VM
          # Assumes SSH key is configured on the runner
          TARGET_USER="root"
          TARGET_HOST="192.168.75.35"
          TARGET_DIR="/opt/tty-workplace-guide"
          
          echo "Pushing backend..."
          rsync -avz --exclude 'node_modules' ./backend/ $TARGET_USER@$TARGET_HOST:$TARGET_DIR/backend/
          
          echo "Pushing frontend dist..."
          rsync -avz ./frontend/dist/ $TARGET_USER@$TARGET_HOST:$TARGET_DIR/frontend/
          
          echo "Restarting backend..."
          ssh $TARGET_USER@$TARGET_HOST "pm2 restart tty-backend"
